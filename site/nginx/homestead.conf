# ============================================================
#  湖畔家园 Homestead —— 游戏官网
#
#  · 监听 80，作为默认站点，用 IP 直接访问
#  · 订阅路径通过 snippets/homestead-sub.conf 原样保留
#  · 与 sing-box 无关：443 / 8443 / 8445 全部不受影响
# ============================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    root /var/www/game;
    index index.html;

    access_log /var/log/nginx/homestead-access.log;
    error_log  /var/log/nginx/homestead-error.log;

    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- 安装包：走 alias，不压缩（已是压缩格式），允许续传 ----------
    location /download/ {
        alias /var/www/game/download/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # ---------- 订阅服务：从原 sub 站点原样搬来，URL 不变 ----------
    include /etc/nginx/snippets/homestead-sub.conf;

    # ---------- 静态资源长缓存 ----------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # ---------- 站点本体 ----------
    location / {
        try_files $uri $uri/ =404;
    }
}
