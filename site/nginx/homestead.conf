# ============================================================
#  Peace —— 游戏官网
#
#  · 80：域名 301 跳 HTTPS；裸 IP 直访照旧；订阅故意留在 80 不跳；
#        /.well-known/acme-challenge/ 给 Let's Encrypt 续期用
#  · 443：HTTPS 正式站点，证书 /etc/letsencrypt/live/yukeyao.sbs/
#  · 与 sing-box 无关：8443 / 8444 / 8445 / 9443 全部不受影响
#
#  订阅 location 在 80 和 443 两边都挂，所以老的
#  http://<IP>/<token>/clash.yaml 和新的
#  https://<域名>/<token>/clash.yaml 都能用。
# ============================================================

# ------------------------------------------------------------
#  80 端口：ACME 验证 + 订阅 + 域名跳转
# ------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # 声明域名是为了让 Host 匹配明确；保留 default_server 所以裸 IP 访问照旧。
    # 加新域名只改这一行 + DNS 即可，不用动别的。
    server_name yukeyao.sbs www.yukeyao.sbs _;

    server_tokens off;
    root /var/www/game;
    index index.html;

    access_log /var/log/nginx/homestead-access.log;
    error_log  /var/log/nginx/homestead-error.log;

    charset utf-8;

    # ---------- Let's Encrypt 域名验证 ----------
    # HTTP-01 挑战必须走 80 明文，证书续期时 certbot 会往这里写文件。
    # 单独给一个 root，免得以后动 location / 把续期搞挂。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    # ---------- 订阅服务：故意留在 80 上不跳转 ----------
    # 老订阅链接是 http://107.173.70.200/<token>/clash.yaml。如果这里跟着
    # 301 到 https://107.173.70.200/...，客户端会撞上「证书是给 yukeyao.sbs 的」
    # 而握手失败，所以订阅必须在 80 上原样可用。
    include /etc/nginx/snippets/homestead-sub.conf;

    # ---------- 安装包：走 alias，不压缩（已是压缩格式），允许续传 ----------
    location /download/ {
        alias /var/www/game/download/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # ---------- 游戏热更新补丁：version.json 不缓存，patch.pck 允许断点续传 ----------
    location /update/ {
        alias /var/www/game/update/;
        autoindex off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # ---------- 其余：域名跳 HTTPS，裸 IP 直接给站点 ----------
    # 裸 IP 不能跳：IP 上没有证书，跳过去浏览器只会报错。
    # （if + return 是 nginx 里少数安全用法之一：rewrite 阶段求值，不碰其他指令。）
    location / {
        if ($host = yukeyao.sbs)     { return 301 https://$host$request_uri; }
        if ($host = www.yukeyao.sbs) { return 301 https://$host$request_uri; }
        try_files $uri $uri/ =404;
    }
}

# ------------------------------------------------------------
#  443 端口：HTTPS 正式站点
# ------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yukeyao.sbs www.yukeyao.sbs;

    ssl_certificate     /etc/letsencrypt/live/yukeyao.sbs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yukeyao.sbs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    root /var/www/game;
    index index.html;

    access_log /var/log/nginx/homestead-access.log;
    error_log  /var/log/nginx/homestead-error.log;

    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- 安装包：走 alias，不压缩（已是压缩格式），允许续传 ----------
    location /download/ {
        alias /var/www/game/download/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # ---------- 游戏热更新补丁：version.json 不缓存，patch.pck 允许断点续传 ----------
    location /update/ {
        alias /var/www/game/update/;
        autoindex off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # ---------- 订阅服务：HTTPS 版（老链接继续走 80，两边都可用） ----------
    include /etc/nginx/snippets/homestead-sub.conf;

    # ---------- 静态资源长缓存 ----------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # ---------- 站点本体 ----------
    location / {
        try_files $uri $uri/ =404;
    }
}
