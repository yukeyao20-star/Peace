# ============================================================================
#  订阅流量头：$sub_userinfo 变量定义
#
#  为什么要单独放这个文件：
#    libnginx-mod-http-perl 在 Ubuntu 24.04 的构建里，perl_set 只允许出现在
#    http 上下文。写进 server{} 或 location{} 会报
#        "perl_set" directive is not allowed here
#    而 nginx.conf 的 http 块里正好 include 了 conf.d/*.conf（在 sites-enabled
#    之前），所以放这里最合适，不用去改全局的 nginx.conf。
#
#  数据来源：
#    /usr/local/bin/vps-traffic 每分钟刷新一次 /var/lib/vps-traffic/userinfo.txt
#    这里每次请求读一遍，供 homestead-sub.conf 的 add_header 使用。
# ============================================================================

perl_set $sub_userinfo 'sub {
    my $f = "/var/lib/vps-traffic/userinfo.txt";
    if (open(my $fh, "<", $f)) {
        local $/;
        my $v = <$fh>;
        close($fh);
        $v =~ s/[[:space:]]+$//;
        return $v if length($v);
    }
    return "upload=0; download=0; total=4398046511104; expire=2051196519";
}';
