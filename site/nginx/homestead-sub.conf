# 订阅服务 location —— 从原 /etc/nginx/sites-available/sub 原样搬出
# URL 与行为完全不变：http://<IP>/b6857c30ccccbf704d1d7575a6cbd5b9/xxx
location /b6857c30ccccbf704d1d7575a6cbd5b9/ {
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;
    root /var/www/sub;
    autoindex off;
    try_files $uri =404;

    # 伪装成机场的流量信息头
    add_header subscription-userinfo "upload=0; download=0; total=1099511627776; expire=1793289600" always;
    add_header profile-update-interval 24 always;
    add_header Cache-Control "no-store" always;
}
