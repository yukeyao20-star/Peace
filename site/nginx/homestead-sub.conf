# 订阅服务 location —— 从原 /etc/nginx/sites-available/sub 原样搬出
# URL 与行为完全不变：http://<IP>/b6857c30ccccbf704d1d7575a6cbd5b9/xxx
location /b6857c30ccccbf704d1d7575a6cbd5b9/ {
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;
    root /var/www/sub;
    autoindex off;
    try_files $uri =404;

    # 真实流量信息头。变量 $sub_userinfo 定义在
    # /etc/nginx/conf.d/traffic-userinfo.conf（perl_set 只能写在 http 上下文，
    # 放 location 里会报 "directive is not allowed here"）。
    # 数字由 /usr/local/bin/vps-traffic 每分钟刷新，Clash 读这个头显示"已用 / 总量"。
    add_header subscription-userinfo $sub_userinfo always;
    add_header profile-update-interval 24 always;
    add_header Cache-Control "no-store" always;
}
